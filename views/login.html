<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0ea5a4">
    <meta name="description" content="Employee attendance tracking system">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>Login — TallyUp</title>
    <link rel="stylesheet" href="/mobile.css">
    <link rel="stylesheet" href="/flatpickr.min.css">
    <link rel="stylesheet" href="/airbnb.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Apply branding color immediately to prevent flash -->
    <script>
      ( function ()
      {
        const cached = localStorage.getItem( 'brandColor' );
        if ( cached )
        {
          document.documentElement.style.setProperty( '--brand-color', cached );
          document.documentElement.style.setProperty( '--accent', cached );
          const metaTheme = document.querySelector( 'meta[name="theme-color"]' );
          if ( metaTheme ) metaTheme.setAttribute( 'content', cached );
        }

        fetch( '/branding' ).then( res => res.json() ).then( data =>
        {
          if ( data.brandColor )
          {
            localStorage.setItem( 'brandColor', data.brandColor );
            if ( data.brandColor !== cached )
            {
              document.documentElement.style.setProperty( '--brand-color', data.brandColor );
              document.documentElement.style.setProperty( '--accent', data.brandColor );
              const metaTheme = document.querySelector( 'meta[name="theme-color"]' );
              if ( metaTheme ) metaTheme.setAttribute( 'content', data.brandColor );
            }
          }
        } ).catch( () => { } );
      } )();
    </script>
  </head>

  <body>
    <div class="container" style="justify-content: center; min-height: calc(100vh - 40px);">
      
      <!-- Apple Inset Login Squircle -->
      <div class="card" style="padding: 28px 24px;">
        <div style="text-align: center; margin-bottom: 24px;">
          <div style="width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, var(--accent) 0%, #0d9488 100%); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 0 10px 25px -4px rgba(var(--accent-rgb), 0.4); margin-bottom: 12px;">
            <i class="fas fa-fingerprint"></i>
          </div>
          <h1 style="font-size: 1.65rem; margin-bottom: 4px;">Sign In</h1>
          <p class="muted" style="font-size: 0.88rem;">TallyUp Mobile Attendance Portal</p>
        </div>

        <div id="login-error" class="status-rejected" style="display:none; padding: 12px 14px; border-radius: 12px; font-size: 0.88rem; margin-bottom: 16px; text-align: center; font-weight: 600;"></div>
        
        <form action="/login" method="post" style="display: flex; flex-direction: column; gap: 14px;">
          <div>
            <label for="name">Username</label>
            <input type="text" id="name" name="name" placeholder="e.g. atul, smita, manuj" required autocomplete="username" autocapitalize="none">
          </div>

          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <div style="margin-top: 8px;">
            <button type="submit" id="login-submit-btn">
              <i class="fas fa-arrow-right"></i> Sign In to Account
            </button>
          </div>
        </form>
      </div>

      <div style="text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 8px;">
        Protected by Apple Face ID & Biometrics
      </div>
    </div>

    <script src="/pwa-size.js"></script>
    <script src="/ui.js"></script>
    <script>
      ( async function ()
      {
        try
        {
          const res = await fetch( '/login/error' );
          if ( !res.ok ) return;
          const data = await res.json();
          if ( data && data.error )
          {
            const el = document.getElementById( 'login-error' );
            el.textContent = data.error;
            el.style.display = 'block';
            if (window.triggerHaptic) triggerHaptic('error');
          }
        } catch ( e ) {}
      } )();

      ( function ()
      {
        try
        {
          const params = new URLSearchParams( window.location.search );
          if ( params.get( 'desktop_blocked' ) === '1' )
          {
            if ( window.showAppModal )
            {
              showAppModal( 'Hey there! 👋 For security, please sign in from your mobile device. Contact your admin if you need desktop access.', 'error' );
            } else
            {
              const el = document.getElementById( 'login-error' );
              el.textContent = 'Hey there! 👋 For security, please sign in from your mobile device. Contact your admin if you need desktop access.';
              el.style.display = 'block';
            }
          }
        } catch ( e ) { }
      } )();
    </script>
    <script src="/flatpickr.min.js"></script>
  </body>

</html>
